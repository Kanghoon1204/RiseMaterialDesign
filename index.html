
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Material Design 3 Components</title>
    <meta name="title" content="Material Design 3 Components" />
    <meta name="description" content="Interactive Material Design 3 component showcase featuring buttons, cards, dialogs, navigation, and more. Explore M3 design system with live examples." />
    <meta name="keywords" content="Material Design 3, M3, UI Components, Design System, React, Web Components" />
    <meta name="author" content="Rise Material Design" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#6750A4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#D0BCFF" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Material Design 3 Components" />
    <meta property="og:description" content="Interactive Material Design 3 component showcase featuring buttons, cards, dialogs, navigation, and more." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Material Design 3 Components" />
    <meta name="twitter:description" content="Interactive Material Design 3 component showcase featuring buttons, cards, dialogs, navigation, and more." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configure Tailwind to use class-based dark mode
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <script>
      // Set theme based on localStorage or system preference
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <style>
      @keyframes progress-indeterminate {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
      @keyframes slide-up {
        0% { transform: translate(-50%, 100%); opacity: 0; }
        100% { transform: translate(-50%, 0); opacity: 1; }
      }
      @keyframes scale-in {
        0% { transform: scale(0.9); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes fade-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes slide-right {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(0); }
      }
    </style>

    "react/": "https://aistudiocdn.com/react@^19.1.1/",
    "react": "https://aistudiocdn.com/react@^19.1.1"
  }
}
</script>
</head>
